<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Motors Shela - Share Your Experience</title>
    <style>
        /* Apple-inspired design with red/white/black theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            line-height: 1.5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            color: white;
            font-weight: bold;
        }
        
        h1 {
            color: #1d1d1f;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .subtitle {
            color: #86868b;
            font-size: 17px;
        }
        
        .form-container {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .form-section {
            margin-bottom: 24px;
        }
        
        .form-section h2 {
            color: #1d1d1f;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-section h2::before {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #ff3b30;
            border-radius: 50%;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            background-color: white;
            transition: all 0.2s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff3b30;
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1);
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .rating-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .star {
            font-size: 28px;
            color: #e2e2e7;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .star.active, .star:hover {
            color: #ff3b30;
            transform: scale(1.1);
        }
        
        .stars-container {
            direction: rtl;
            unicode-bidi: bidi-override;
        }
        
        .stars-container .star {
            direction: ltr;
            unicode-bidi: bidi-override;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            letter-spacing: -0.5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 59, 48, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .success-message {
            display: none;
            background: #fff5f5;
            border: 1px solid #ffdcdc;
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
        }
        
        .success-message h3 {
            color: #ff3b30;
            font-size: 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .success-message h3::before {
            content: '✓';
            width: 24px;
            height: 24px;
            background-color: #ff3b30;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        
        .success-message p {
            color: #1d1d1f;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .qr-container {
            text-align: center;
            margin: 24px 0;
        }
        
        .qr-code {
            width: 180px;
            height: 180px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        
        .review-text {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 20px;
            margin: 24px 0;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
        }
        
        .btn-copy {
            background: #f2f2f7;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }
        
        .btn-copy:hover {
            background: #e5e5ea;
            border-color: #c7c7cc;
        }
        
        .btn-copy:active {
            transform: scale(0.98);
        }
        
        /* Admin panel for viewing/sampling reviews */
        .admin-panel {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-top: 32px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .admin-panel h2 {
            color: #1d1d1f;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .btn-admin {
            background: #f2f2f7;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-right: 12px;
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .btn-admin:hover {
            background: #e5e5ea;
        }
        
        .btn-admin.primary {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            color: white;
            border: none;
        }
        
        .btn-admin.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 59, 48, 0.3);
        }
        
        .reviews-list {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
        }
        
        .review-item {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .review-item:last-child {
            border-bottom: none;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .review-name {
            font-weight: 600;
            color: #1d1d1f;
        }
        
        .review-date {
            font-size: 13px;
            color: #86868b;
        }
        
        .review-stars {
            margin: 8px 0;
        }
        
        .review-service {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .review-car {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .review-comments {
            color: #1d1d1f;
            line-height: 1.5;
        }
        
        /* Responsive design for iPad */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            
            .form-container {
                padding: 20px;
                border-radius: 14px;
            }
            
            .logo {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 15px;
            }
            
            .btn {
                padding: 14px 20px;
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .logo {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">FM</div>
            <h1>First Motors Shela</h1>
            <p class="subtitle">Premium Auto Care • Shela, Ahmedabad</p>
        </div>
        
        <div class="form-container">
            <form id="reviewForm">
                <div class="form-section">
                    <h2>Your Information</h2>
                    <div class="form-group">
                        <label for="customerName">Your Name</label>
                        <input type="text" id="customerName" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="carMake">Car Make</label>
                        <input type="text" id="carMake" placeholder="e.g., Hyundai, Toyota, BMW" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="carModel">Car Model</label>
                        <input type="text" id="carModel" placeholder="e.g., Creta, Fortuner, 3 Series" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Service Details</h2>
                    <div class="form-group">
                        <label for="service">Service Received</label>
                        <select id="service" required>
                            <option value="">Select your service</option>
                            <option value="PPF Installation">Premium PPF Installation</option>
                            <option value="Ceramic Coating">Graphene/Ceramic Coating</option>
                            <option value="Denting Painting">Accident Repair & Paint</option>
                            <option value="Periodic Service">Scheduled Maintenance</option>
                            <option value="Car Wash Detailing">Premium Wash & Detailing</option>
                            <option value="Other">Other Service</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="otherServiceGroup" style="display: none;">
                        <label for="otherService">Please specify</label>
                        <input type="text" id="otherService" placeholder="What service did you receive?">
                    </div>
                    
                    <div class="form-group">
                        <label for="technician">Technician (Optional)</label>
                        <input type="text" id="technician" placeholder="Who assisted you? (e.g., Rajesh, Amit, Prakash)">
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Your Experience</h2>
                    <div class="form-group">
                        <label>Your Rating</label>
                        <div class="rating-group">
                            <div class="stars-container">
                                <span class="star" data-rating="1">★</span>
                                <span class="star" data-rating="2">★</span>
                                <span class="star" data-rating="3">★</span>
                                <span class="star" data-rating="4">★</span>
                                <span class="star" data-rating="5">★</span>
                            </div>
                        </div>
                        <input type="hidden" id="rating" name="rating" value="0">
                    </div>
                    
                    <div class="form-group">
                        <label for="reviewText">Additional Comments (Optional)</label>
                        <textarea id="reviewText" rows="4" placeholder="What did you love about your service? Any specific details?"></textarea>
                    </div>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">Generate Review & QR Code</button>
            </form>
        </div>
        
        <div id="successMessage" class="success-message">
            <h3>Your Review is Ready!</h3>
            <p>Scan the QR code to view/share your review, or copy the text below.</p>
            <div class="qr-container">
                <div id="qrCode" class="qr-code"></div>
            </div>
            <div class="review-text" id="generatedReview"></div>
            <button class="btn-copy" id="copyBtn">Copy Review Text</button>
        </div>
        
        <!-- Admin Panel for managing reviews -->
        <div class="admin-panel">
            <h2>Review Management</h2>
            <button class="btn-admin primary" id="generateSamplesBtn">Generate 500 Sample Reviews</button>
            <button class="btn-admin" id="viewReviewsBtn">View All Reviews</button>
            <button class="btn-admin" id="clearReviewsBtn">Clear All Reviews</button>
            <button class="btn-admin" id="exportReviewsBtn">Export Reviews</button>
            
            <div id="reviewsListContainer" style="display: none;">
                <h3>All Submitted Reviews</h3>
                <div id="reviewsList" class="reviews-list"></div>
            </div>
        </div>
    </div>

    <script>
        // Review storage using localStorage
        const STORAGE_KEY = 'firstMotorsReviews';
        
        // Initialize storage if empty
        function initStorage() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
            }
        }
        
        // Get all reviews
        function getReviews() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }
        
        // Save a review
        function saveReview(reviewData) {
            const reviews = getReviews();
            reviews.push({
                ...reviewData,
                id: Date.now() + Math.random(),
                timestamp: new Date().toISOString()
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
        }
        
        // Clear all reviews
        function clearReviews() {
            if (confirm('Are you sure you want to delete all reviews? This action cannot be undone.')) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
                updateReviewsList();
                alert('All reviews have been cleared.');
            }
        }
        
        // Generate sample humanized reviews based on our earlier data
        function generateSampleReviews() {
            const serviceTypes = [
                'Premium PPF Installation',
                'Graphene/Ceramic Coating', 
                'Accident Repair & Paint',
                'Scheduled Maintenance',
                'Premium Wash & Detailing'
            ];
            
            const carMakes = ['Hyundai', 'Toyota', 'BMW', 'Mercedes-Benz', 'Honda', 'Kia', 'Ford', 'Volkswagen', 'Audi', 'Porsche'];
            const carModels = {
                'Hyundai': ['Creta', 'Venue', 'i20', 'Verna', 'Tucson', 'Santa Fe'],
                'Toyota': ['Fortuner', 'Innova', 'Etios', 'Yaris', 'Camry', 'Corolla'],
                'BMW': ['3 Series', '5 Series', 'X1', 'X3', 'X5', '7 Series'],
                'Mercedes-Benz': ['C-Class', 'E-Class', 'S-Class', 'GLC', 'GLE', 'GLS'],
                'Honda': ['City', 'Amaze', 'WR-V', 'Jazz', 'BR-V', 'CR-V'],
                'Kia': ['Seltos', 'Sonet', 'Carens', 'Sportage', 'Carnival'],
                'Ford': ['EcoSport', 'Endeavour', 'Figo', 'Aspire', 'Freestyle'],
                'Volkswagen': ['Polo', 'Vento', 'Ameo', 'Tiguan', 'Taigun'],
                'Audi': ['A3', 'A4', 'A6', 'Q3', 'Q5', 'Q7'],
                'Porsche': ['Cayenne', 'Macan', 'Panamera', '911', 'Taycan']
            };
            
            const technicianNames = ['Rajesh', 'Amit', 'Prakash', 'Vikram', 'Suresh', 'Deepak', 'Manoj', 'Nilesh', 'Ankit', 'Sunil', 'Dinesh', 'Harish', 'Kiran', 'Rohit', 'Ganesh'];
            const feedbackOptions = [
                'Excellent service, highly professional team',
                'Transparent pricing and great communication',
                'Fixed my car on time, will definitely return',
                'Outstanding attention to detail',
                'Best service center in Shela area',
                'Staff went above and beyond expectations',
                'Quality workmanship with genuine parts',
                'Clean facility with comfortable waiting area',
                'Quick turnaround without compromising quality',
                'Value for money service',
                'Hydrophobic coating working perfectly after 6 months',
                'PPF installation flawless, no orange peel',
                'Ceramic coating makes washing effortless',
                'Accident repair invisible, perfect color match',
                'Periodic service thorough and honest',
                'Detailing made my car look showroom new',
                'Wheel ceramic coating is a game changer',
                'Glass coating improved visibility in monsoon',
                'Headlight restoration saved me replacement cost',
                'Engine bay detailing impressed the mechanic'
            ];
            
            const carComments = [
                'Really verry good and excellent experience',
                'Excellent service! The staff was highly professional, transparent with pricing, and fixed my car on time. Strongly recommended',
                'Outstanding denting and painting work on my Fortuner at First Motors, Ahmedabad! The finish is top-notch, looks fresh out of the showroom, and the staff is extremely professional and polite. Highly recommended for quality bodywork!',
                'Got PPF coating done for my Hyundai Creta. Rajesh walked me through XPEL vs Garware options - went with ultimate plus full body. Finish is insane, edges are invisible.',
                '9H ceramic coating on my Tata Harrier - Amit explained graphene benefits. 5-layer process, hydrophobic test impressive. Water beads like mercury.',
                'Bought XUV700, wanted full protection before first scratch. Vikram suggested Garware PPF "made for indian roads". 3 days, loaner car provided.',
                '9H ceramic on Honda City. Suresh was cool, didn't rush me. Hydrophobic effect real, Sunday washes take half the time now.',
                'XPEL Stealth (matte PPF) on my Compass. Deepak nailed the texture - no orange peel, no weird gloss patches.',
                'Graphene ceramic on Skoda Slavia. Prakash explained why it handles heat better. Still beads after 6 months.',
                'Best PPF install in Shela, no debate. XPEL Ultimate Plus on Fortuner. Manoj n team took 3 days, every panel perfect.',
                'Price compared for Swift ceramic coating. First Motors Shela won on value. Basic 9H package + steam wash.',
                'Searched "PPF near me Shela" - found these guys. Steam wash first, then Garware PPF on Seltos.',
                'Graphene coating + PPF front on MG Hector. Ankit managed job, WhatsApp updates daily with photos.',
                'Full body PPF cost was 15% less than other premium shops for SAME XPEL film.',
                '9H ceramic coating on my old EcoSport (2017). Dinesh said "we prep like it\'s new" - and they did.',
                'XPEL Stealth matte PPF on BMW 3 Series. Harish has luxury car experience, shows.',
                'Color match on my White Swift - good but not perfect in direct sun. Suresh said "pearlescent is tricky" - fair.',
                'XUV700 side panel dent + scratch. Manoj did PDR for dent, precision spot repair for scratch.',
                'Hit median divider - lower control arm bent, fender cracked. Ankit coordinated insurance claim, suspension repair, computerized alignment, OEM paint.',
                'Parking lot dent on driver door (no paint damage). Sunil did PDR. 45 mins. Dent gone. Charged 800 bucks.',
                'Full panel respray on 5 year old City (faded clear coat). Kiran prepped properly - sanded, primed, basecoat, clearcoat.',
                'Major service on Creta (40k km). Rajesh showed me old parts - brake pads, air filter, oil filter.',
                'Oil change + filter on Harrier. Took 45 mins. Suresh used Castrol Edge 5W30 (spec), not some random brand.',
                'AC service before summer. Vikram said "gas low, leak detection test first" - found condenser leak.',
                'Wheel alignment + balancing on Slavia. Prakash showed me before/after printout. Camber was off (hit pothole hard).',
                'Periodic service on Hector (20k). Nilesh called: "brake fluid 3 years old, suggest DOT 4 replacement" - did it.',
                'Minor service on Swift. Ganesh did it quick. Only thing: forgot to reset trip meter (petty I know).',
                'Clutch replacement on EcoSport (65k). Deepak diagnosed slip, quoted OEM Luk kit. 2 days. Clutch feel light, no judder.',
                'Timing belt + water pump kit on Fortuner (90k). Amit said "do both, labor same" - smart. OEM Gates kit.',
                'Battery replacement on i20. Suresh load-tested first (was actually alternator issue!). Saved me battery cost.',
                'Suspension overhaul on Taigun - shocks, mounts, bushes. Manoj showed me cracked bushes. OEM Bilstein replacements.',
                'Transmission oil change on GLA (Mercedes). Ankit used Fuchs spec oil, proper drain/fill (not flush machine).',
                'Pre-monsoon checkup on XUV700. Kiran checked wipers, brakes, tyres, lights, underbody. Gave report card.',
                'Steam wash + interior detailing on Creta. Rohit\'s team - seats shampooed, carpet extracted, dashboard conditioned.',
                'Ceramic maintenance wash on my coated Harrier. Prakash used pH-neutral shampoo, 2 bucket method, drying aid.',
                'Basic wash on Swift. Quick, 300 bucks. But they used same mitt for wheels and paint - told them, they corrected.',
                'Full interior deep cleaning on Slavia (spilled coffee). Nilesh\'s team - seats extracted, stains removed, leather conditioned.',
                'Engine bay detailing on Fortuner (oil leak mess). Deepak covered electrics, degreased, steam cleaned, dressed plastics.',
                'Headlight restoration on City (yellowed, hazy). Suresh wet sanded, machine polished, UV clear coated.',
                'Paint correction + ceramic topper on PPF (2 years old). Amit did single-stage machine polish on film, reapplied ceramic booster.',
                'Water spot removal on black Hector (garage sprinklers). Manoj - acid wash, machine polish, ceramic boost.',
                'Wheel ceramic coating on Taigun. Ankit - faces, barrels, lug nuts. Brake dust wipes off now.',
                'Glass coating (all windows) on GLA. Kiran - rain repellent, wipers glide, bugs don\'t stick.',
                'Just a premium wash on my daily Swift. But they - vacuumed mats, wiped dash, dressed tyres, cleaned door shuts.'
            ];
            
            // Generate 500 reviews
            const reviews = [];
            const startDate = new Date('2024-01-01');
            const endDate = new Date();
            
            for (let i = 0; i < 500; i++) {
                const randomDate = new Date(startDate.getTime() + Math.random() * (endDate.getTime() - startDate.getTime()));
                const carMake = carMakes[Math.floor(Math.random() * carMakes.length)];
                const carModel = carModels[carMake][Math.floor(Math.random() * carModels[carMake].length)];
                const serviceType = serviceTypes[Math.floor(Math.random() * serviceTypes.length)];
                const technician = technicianNames[Math.floor(Math.random() * technicianNames.length)];
                const feedback = feedbackOptions[Math.floor(Math.random() * feedbackOptions.length)];
                const carComment = carComments[Math.floor(Math.random() * carComments.length)];
                const rating = Math.floor(Math.random() * 2) + 4; // 4 or 5 stars mostly (weighted toward positive)
                
                // Determine service text
                const serviceText = serviceType;
                
                // Generate review text
                let review = `★★★★★ ${generateRandomName()}'s Review\n\n`;
                review += `Service: ${serviceText}\n`;
                review += `Car: ${carMake} ${carModel}\n`;
                if (technician) {
                    review += `Technician: ${technician}\n`;
                }
                review += `Rating: ${rating}/5\n`;
                if (feedback) {
                    review += `Feedback: ${feedback}\n`;
                }
                if (carComment && Math.random() > 0.3) { // 70% chance to include car comment
                    review += `Comments: ${carComment}\n`;
                }
                review += `\nFirst Motors Shela provided excellent premium service. Highly recommend! #FirstMotorsShela`;
                
                reviews.push({
                    id: Date.now() + i,
                    timestamp: randomDate.toISOString(),
                    customerName: generateRandomName(),
                    carMake: carMake,
                    carModel: carModel,
                    service: serviceText,
                    technician: technician || '',
                    rating: rating,
                    feedback: feedback || '',
                    comments: carComment || '',
                    reviewText: review
                });
            }
            
            // Save all reviews
            localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
            alert('Generated 500 sample reviews successfully!');
            updateReviewsList();
        }
        
        // Generate random Indian-sounding names
        function generateRandomName() {
            const firstNames = ['Rahul', 'Priya', 'Amit', 'Sneha', 'Vikram', 'Ananya', 'Rohit', 'Kavya', 'Arjun', 'Diya', 'Sameer', 'Neha', 'Karishma', 'Varun', 'Pooja'];
            const lastNames = ['Sharma', 'Patel', 'Singh', 'Kumar', 'Gupta', 'Reddy', 'Desai', 'Joshi', 'Mehta', 'Agarwal', 'Bose', 'Malhotra'];
            return `${firstNames[Math.floor(Math.random() * firstNames.length)]} ${lastNames[Math.floor(Math.random() * lastNames.length)]}`;
        }
        
        // Update the reviews list display
        function updateReviewsList() {
            const reviews = getReviews();
            const reviewsList = document.getElementById('reviewsList');
            
            if (reviews.length === 0) {
                reviewsList.innerHTML = '<p style="text-align: center; padding: 20px; color: #86868b;">No reviews yet. Be the first to submit a review!</p>';
                return;
            }
            
            // Show newest first
            const sortedReviews = [...reviews].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            reviewsList.innerHTML = sortedReviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <span class="review-name">${review.customerName}</span>
                        <span class="review-date">${new Date(review.timestamp).toLocaleDateString()}</span>
                    </div>
                    <div class="review-stars">
                        ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}
                    </div>
                    <div class="review-service">Service: ${review.service}</div>
                    <div class="review-car">Car: ${review.carMake} ${review.carModel}</div>
                    ${review.technician ? `<div class="review-technician">Technician: ${review.technician}</div>` : ''}
                    ${review.feedback ? `<div class="review-feedback">Feedback: ${review.feedback}</div>` : ''}
                    ${review.comments ? `<div class="review-comments">Comments: ${review.comments}</div>` : ''}
                </div>
            `).join('');
        }
        
        // Export reviews as JSON
        function exportReviews() {
            const reviews = getReviews();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reviews, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "first_motors_reviews.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            initStorage();
            
            const form = document.getElementById('reviewForm');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            const copyBtn = document.getElementById('copyBtn');
            const qrCodeContainer = document.getElementById('qrCode');
            const generateSamplesBtn = document.getElementById('generateSamplesBtn');
            const viewReviewsBtn = document.getElementById('viewReviewsBtn');
            const clearReviewsBtn = document.getElementById('clearReviewsBtn');
            const exportReviewsBtn = document.getElementById('exportReviewsBtn');
            const reviewsListContainer = document.getElementById('reviewsListContainer');
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Get form values
                const customerName = document.getElementById('customerName').value.trim();
                const carMake = document.getElementById('carMake').value.trim();
                const carModel = document.getElementById('carModel').value.trim();
                const service = document.getElementById('service').value;
                const otherService = document.getElementById('otherService').value.trim();
                const technician = document.getElementById('technician').value.trim();
                const rating = document.getElementById('rating').value;
                const comments = document.getElementById('reviewText').value.trim();
                
                // Validate
                if (!customerName) {
                    alert('Please enter your name');
                    return;
                }
                
                if (!carMake) {
                    alert('Please enter car make');
                    return;
                }
                
                if (!carModel) {
                    alert('Please enter car model');
                    return;
                }
                
                if (!service) {
                    alert('Please select a service');
                    return;
                }
                
                if (service === 'Other' && !otherService) {
                    alert('Please specify your service');
                    return;
                }
                
                if (rating === '0') {
                    alert('Please give a rating');
                    return;
                }
                
                // Show loading state
                submitBtn.disabled = true;
                submitBtn.textContent = 'Generating...';
                
                // Determine service text
                const serviceText = service === 'Other' ? otherService : service;
                
                // Generate review text
                let review = `★★★★★ ${customerName}'s Review\n\n`;
                review += `Service: ${serviceText}\n`;
                review += `Car: ${carMake} ${carModel}\n`;
                if (technician) {
                    review += `Technician: ${technician}\n`;
                }
                review += `Rating: ${rating}/5\n`;
                if (comments) {
                    review += `Feedback: ${comments}\n`;
                }
                review += `\nFirst Motors Shela provided excellent premium service. Highly recommend! #FirstMotorsShela`;
                
                // Save review
                saveReview({
                    customerName: customerName,
                    carMake: carMake,
                    carModel: carModel,
                    service: serviceText,
                    technician: technician,
                    rating: parseInt(rating),
                    feedback: comments,
                    comments: '',
                    reviewText: review
                });
                
                // Show success message
                form.style.display = 'none';
                successMessage.style.display = 'block';
                document.getElementById('generatedReview').textContent = review;
                
                // Generate QR code for Google review link using Place ID
                const placeId = "ChIJ8XMuPACbXjkRGooqnFfuFco"; // From your Google Maps URL
                const googleReviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
                qrCodeContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(googleReviewUrl)}" alt="QR Code for Google Review" class="qr-code">`;
                
                // Reset button state after delay
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Generate Review & QR Code';
                }, 1500);
            });
            
            // Copy to clipboard
            copyBtn.addEventListener('click', function() {
                const reviewText = document.getElementById('generatedReview').textContent;
                navigator.clipboard.writeText(reviewText).then(() => {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 1500);
                }).catch(err => {
                    alert('Failed to copy: ' + err);
                });
            });
            
            // Star rating functionality
            const stars = document.querySelectorAll('.star');
            const ratingInput = document.getElementById('rating');
            
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const rating = star.getAttribute('data-rating');
                    ratingInput.value = rating;
                    
                    // Update visual state
                    stars.forEach(s => {
                        s.classList.toggle('active', s.getAttribute('data-rating') <= rating);
                    });
                });
                
                star.addEventListener('mouseover', () => {
                    const rating = star.getAttribute('data-rating');
                    stars.forEach(s => {
                        s.classList.toggle('hover', s.getAttribute('data-rating') <= rating);
                    });
                });
                
                star.addEventListener('mouseout', () => {
                    stars.forEach(s => {
                        s.classList.remove('hover');
                    });
                });
            });
            
            // Service selection handling
            const serviceSelect = document.getElementById('service');
            const otherServiceGroup = document.getElementById('otherServiceGroup');
            
            serviceSelect.addEventListener('change', () => {
                if (serviceSelect.value === 'Other') {
                    otherServiceGroup.style.display = 'block';
                } else {
                    otherServiceGroup.style.display = 'none';
                    document.getElementById('otherService').value = '';
                }
            });
            
            // Admin button handlers
            generateSamplesBtn.addEventListener('click', generateSampleReviews);
            viewReviewsBtn.addEventListener('click', () => {
                reviewsListContainer.style.display = 'block';
                updateReviewsList();
            });
            clearReviewsBtn.addEventListener('click', clearReviews);
            exportReviewsBtn.addEventListener('click', exportReviews);
        });
    </script>
</body>
</html>
